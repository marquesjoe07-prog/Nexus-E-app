<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus-E | Sparks Techno</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #070b14; 
            --neon-cyan: #06b6d4; 
            --neon-blue: #3b82f6;
            --glass-bg: rgba(15, 23, 42, 0.75); 
            --glass-border: rgba(6, 182, 212, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: all 0.3s ease; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #1e3a8a, var(--bg-dark) 70%);
            color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }
        .grid-bg {
            position: absolute; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
        }
        .login-container {
            background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 40px; width: 100%; max-width: 450px;
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.18), inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 {
            font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; text-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        }
        .header p { color: #94a3b8; font-size: 0.88rem; letter-spacing: 0.5px; margin-top: 4px; }
        .tab-box { display: flex; background: rgba(0,0,0,0.4); border-radius: 12px; margin-bottom: 22px; padding: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .tab-btn { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: #94a3b8; }
        .tab-btn.active { background: rgba(6, 182, 212, 0.2); color: var(--neon-cyan); border: 1px solid var(--glass-border); }
        .form-section { display: none; animation: fadeIn 0.3s ease; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .input-group { position: relative; margin-bottom: 18px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--neon-cyan); font-size: 0.95rem; }
        input, select { width: 100%; padding: 13px 14px 13px 44px; background: rgba(0, 0, 0, 0.4); border: 1px solid #334155; border-radius: 10px; color: white; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(6, 182, 212, 0.25); }
        select option { background: #0f172a; color: white; }
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 8px; }
        .btn-viewer { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color: white; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3); }
        .btn-viewer:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45); }
        .btn-admin { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
        .btn-admin:hover { background: rgba(239, 68, 68, 0.2); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.25); }
        .footer-badge { text-align: center; margin-top: 22px; font-size: 0.75rem; color: #64748b; letter-spacing: 1.5px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="login-container">
        <div class="header">
            <h1>NEXUS-E</h1>
            <p>Autonomous Classroom Energy Management</p>
        </div>

        <div class="tab-box">
            <div class="tab-btn active" onclick="switchTab('viewer')">Live Demo (Viewer)</div>
            <div class="tab-btn" onclick="switchTab('admin')"><i class="fa-solid fa-shield-halved"></i> Sparks Admin</div>
        </div>

        <!-- Viewer Form -->
        <div id="viewerForm" class="form-section active">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="vName" placeholder="Enter Full Name">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-id-badge"></i>
                <select id="vRole">
                    <option value="" disabled selected>Select Your Role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Faculty / Teacher</option>
                    <option value="judge">Guest / Tech Fest Judge</option>
                </select>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-hashtag"></i>
                <input type="text" id="vId" placeholder="ID / Roll Number">
            </div>
            <button class="btn-submit btn-viewer" id="viewerBtn" onclick="loginViewer()">Launch Viewer Terminal <i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <!-- Admin Form -->
        <div id="adminForm" class="form-section">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="aEmail" placeholder="admin@sparkstechno.edu">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="aPass" placeholder="Admin Security Key">
            </div>
            <button class="btn-submit btn-admin" id="adminBtn" onclick="loginAdmin()">Authorize Access <i class="fa-solid fa-lock"></i></button>
        </div>

        <div class="footer-badge">GEC BHOJPUR | SPARKS TECHNO | TECH FEST</div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgM4LrgOXnG8c7dDs6hgHbhJ7cSTo7dao",
            authDomain: "nexus-e-fd787.firebaseapp.com",
            databaseURL: "https://nexus-e-fd787-default-rtdb.firebaseio.com",
            projectId: "nexus-e-fd787",
            storageBucket: "nexus-e-fd787.firebasestorage.app",
            messagingSenderId: "850097280209",
            appId: "1:850097280209:web:eb708b0804d75486fae1f0",
            measurementId: "G-MVWZ3YFC3J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Master Administrator UID
        const MASTER_ADMIN_UID = "iLYylCZfyJPPN6h5Qmuof2xuKgu1";

        // Tab Switching
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
            
            if(tab === 'viewer') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('viewerForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('adminForm').classList.add('active');
            }
        };

        // Strict Authenticated Admin Login
        window.loginAdmin = async function() {
            const email = document.getElementById('aEmail').value.trim();
            const pass = document.getElementById('aPass').value.trim();
            const btn = document.getElementById('adminBtn');

            if(!email || !pass) {
                alert("Kripya Email aur Password enter karein!");
                return;
            }
            
            btn.innerHTML = "Verifying Credentials... <i class='fa-solid fa-spinner fa-spin'></i>";
            btn.disabled = true;

            try {
                // Firebase Database se authentic credentials verify karta hai
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // Role allocation based on exact UID
                if (user.uid === MASTER_ADMIN_UID) {
                    sessionStorage.setItem("nexusUserRole", "master_admin");
                } else {
                    sessionStorage.setItem("nexusUserRole", "co_admin");
                }

                sessionStorage.setItem("nexusAdminEmail", user.email);
                sessionStorage.setItem("nexusAdminUid", user.uid);

                window.location.href = "admin_dashboard.html";

            } catch(error) {
                alert("Access Denied: Sirf authorized Sparks Admins hi enter kar sakte hain!");
                btn.innerHTML = "Authorize Access <i class='fa-solid fa-lock'></i>";
                btn.disabled = false;
            }
        };

        // Viewer Access Handler
        window.loginViewer = function() {
            const name = document.getElementById('vName').value.trim();
            const role = document.getElementById('vRole').value;
            const id = document.getElementById('vId').value.trim();
            
            if(!name || !role || !id) {
                alert("Kripya saari details fill karein!");
                return;
            }
            
            sessionStorage.setItem("nexusViewerName", name);
            sessionStorage.setItem("nexusViewerRole", role);
            sessionStorage.setItem("nexusViewerId", id);
            
            window.location.href = "viewer_dashboard.html";
        };
    </script>
</body>
</html>
