<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus-E | Sparks Techno</title>
    
    <!-- Google Fonts: Outfit, Montserrat & Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Anime Glowing Wisteria Night Base */
            --bg-night: #070312;
            
            /* Preserved Glowing Accents */
            --wisteria-glow: #c084fc;
            --wisteria-neon: #a855f7;
            --cyan-glow: #38bdf8;
            
            /* Radiant Metallic Grey / Silver Sheen Palette */
            --radiant-grey-light: #f8fafc;
            --radiant-grey: #e2e8f0;
            --radiant-grey-muted: #94a3b8;
            --radiant-grey-glow: rgba(226, 232, 240, 0.45);
            
            --glass-surface: rgba(18, 10, 36, 0.82);
            --border-glow: rgba(226, 232, 240, 0.22);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: all 0.25s ease; }

        body {
            background-color: var(--bg-night);
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(168, 85, 247, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 50% -10%, #290f5c 0%, var(--bg-night) 75%);
            color: var(--radiant-grey);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Luminous Night Grid */
        .grid-bg {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(226, 232, 240, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(226, 232, 240, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: -1;
        }

        /* Frosted Glass Container with Silver Sheen Rim */
        .login-container {
            background: var(--glass-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-top: 1px solid rgba(248, 250, 252, 0.55);
            border-bottom: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 24px;
            padding: 38px 34px;
            width: 100%;
            max-width: 460px;
            box-shadow: 
                0 22px 55px rgba(0, 0, 0, 0.8),
                0 0 35px rgba(168, 85, 247, 0.16),
                inset 0 0 25px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Top Silver Bloom Accent */
        .login-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            width: 60%;
            height: 2.5px;
            background: linear-gradient(90deg, transparent, var(--radiant-grey-light), transparent);
            border-radius: 10px;
            filter: blur(1px);
        }

        /* ===== POSTER STYLE BRAND HEADER ===== */
        .poster-header {
            text-align: center;
            margin-bottom: 24px;
            user-select: none;
        }

        /* Interactive Brand Wrapper */
        .brand-title-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
        }

        /* Dynamic Energy Speed Bars */
        .speed-bar {
            display: inline-block;
            width: 30px;
            height: 9px;
            border-top: 3px solid var(--cyan-glow);
            border-bottom: 3px solid var(--wisteria-glow);
            border-radius: 2px;
            opacity: 0.95;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            animation: barPulse 3.5s ease-in-out infinite alternate;
        }

        @keyframes barPulse {
            0% { filter: hue-rotate(0deg) drop-shadow(0 0 4px var(--cyan-glow)); }
            100% { filter: hue-rotate(180deg) drop-shadow(0 0 10px var(--wisteria-glow)); }
        }

        /* Interactive Glowing NEXUS-E Title */
        .brand-logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.85rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
            line-height: 1;
            position: relative;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .brand-title-wrap:hover .brand-logo-text {
            transform: scale(1.04);
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.75));
        }

        /* NEXUS: Infinite Fluid Chroma Gradient */
        .nexus-holo {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(120deg, #ffffff 0%, #38bdf8 25%, #c084fc 50%, #f59e0b 75%, #ffffff 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: holoFlow 6s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
        }

        @keyframes holoFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* -E: Hyper-Voltage Neon Core */
        .dash-e-plasma {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            padding-left: 4px;
            color: #38bdf8;
            text-shadow: 
                0 0 10px #38bdf8,
                0 0 20px #818cf8,
                0 0 40px #c084fc;
            animation: plasmaFlicker 2.5s infinite alternate;
        }

        @keyframes plasmaFlicker {
            0% { color: #38bdf8; text-shadow: 0 0 12px #38bdf8, 0 0 25px #818cf8; }
            50% { color: #c084fc; text-shadow: 0 0 16px #c084fc, 0 0 32px #e879f9; }
            100% { color: #38bdf8; text-shadow: 0 0 12px #38bdf8, 0 0 25px #818cf8; }
        }

        /* RADIANT GREY SUB-TEXTS */
        .by-sparks-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .script-by {
            font-family: 'Dancing Script', cursive;
            color: var(--radiant-grey);
            font-size: 1.45rem;
            font-weight: 700;
            transform: rotate(-4deg);
            text-shadow: 0 0 10px var(--radiant-grey-glow);
        }

        .sparks-techno {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 4px;
            color: var(--radiant-grey-light);
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--radiant-grey-glow);
        }

        .script-tagline {
            font-family: 'Dancing Script', cursive;
            color: var(--radiant-grey-muted);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.6px;
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(148, 163, 184, 0.4);
        }

        /* ===== CONTROLS & FORMS (RADIANT GREY) ===== */
        .tab-box {
            display: flex;
            background: rgba(10, 4, 22, 0.55);
            border-radius: 12px;
            margin-bottom: 22px;
            padding: 5px;
            border: 1px solid rgba(226, 232, 240, 0.12);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--radiant-grey-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: rgba(226, 232, 240, 0.12);
            color: var(--radiant-grey-light);
            border: 1px solid rgba(226, 232, 240, 0.35);
            box-shadow: 0 0 12px rgba(226, 232, 240, 0.18);
            text-shadow: 0 0 8px var(--radiant-grey-glow);
        }

        .form-section { display: none; animation: fadeIn 0.3s ease; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { position: relative; margin-bottom: 18px; }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--radiant-grey-muted);
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: rgba(11, 6, 24, 0.55);
            border: 1px solid #334155;
            border-radius: 10px;
            color: var(--radiant-grey-light);
            font-size: 0.95rem;
            outline: none;
        }

        input::placeholder {
            color: var(--radiant-grey-muted);
        }

        input:focus, select:focus {
            border-color: var(--radiant-grey);
            box-shadow: 0 0 14px rgba(226, 232, 240, 0.3);
            background: rgba(22, 11, 46, 0.7);
            color: #ffffff;
        }

        select option { background: #13092b; color: var(--radiant-grey-light); }

        /* Action Buttons */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Radiant Silver Sheen Button */
        .btn-viewer {
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 50%, #94a3b8 100%);
            color: #0b0717;
            font-weight: 900;
            box-shadow: 0 4px 22px rgba(226, 232, 240, 0.28);
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.4);
        }

        .btn-viewer:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(226, 232, 240, 0.45);
            filter: brightness(1.05);
        }

        /* Admin Button */
        .btn-admin {
            background: rgba(226, 232, 240, 0.06);
            border: 1px solid rgba(226, 232, 240, 0.3);
            color: var(--radiant-grey);
            text-shadow: 0 0 8px rgba(226, 232, 240, 0.3);
        }

        .btn-admin:hover {
            background: rgba(226, 232, 240, 0.15);
            box-shadow: 0 4px 18px rgba(226, 232, 240, 0.2);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Radiant Grey Footer */
        .footer-badge {
            text-align: center;
            margin-top: 24px;
            font-size: 0.74rem;
            color: var(--radiant-grey-muted);
            letter-spacing: 2px;
            font-weight: 700;
        }
        .footer-badge span {
            color: var(--radiant-grey-light);
            text-shadow: 0 0 8px var(--radiant-grey-glow);
        }

        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .brand-logo-text { font-size: 2.2rem; }
            .speed-bar { width: 20px; height: 8px; }
            .sparks-techno { font-size: 0.9rem; letter-spacing: 3px; }
            .script-tagline { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="login-container">
        <!-- Interactive Holographic Header -->
        <div class="poster-header">
            <div class="brand-title-wrap" title="NEXUS-E Core">
                <span class="speed-bar"></span>
                <h1 class="brand-logo-text">
                    <span class="nexus-holo">NEXUS</span><span class="dash-e-plasma">-E</span>
                </h1>
                <span class="speed-bar"></span>
            </div>

            <div class="by-sparks-line">
                <span class="script-by">by</span>
                <span class="sparks-techno">SPARKS TECHNO</span>
            </div>

            <div class="script-tagline">
                Next Generation Energy Optimization
            </div>
        </div>

        <!-- Portal Tabs -->
        <div class="tab-box">
            <div class="tab-btn active" onclick="switchTab('viewer')">
                <i class="fa-solid fa-users-viewfinder"></i> User Portal
            </div>
            <div class="tab-btn" onclick="switchTab('admin')">
                <i class="fa-solid fa-shield-halved"></i> Sparks Admin
            </div>
        </div>

        <!-- User / Guest Portal Form -->
        <div id="viewerForm" class="form-section active">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="vName" placeholder="Enter Full Name">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-id-badge"></i>
                <select id="vRole">
                    <option value="" disabled selected>Select Your Role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Faculty / Teacher</option>
                    <option value="judge">Guest / Tech Fest Judge</option>
                </select>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-hashtag"></i>
                <input type="text" id="vId" placeholder="ID / Roll Number">
            </div>
            <button class="btn-submit btn-viewer" id="viewerBtn" onclick="loginViewer()">
                Enter Interactive Terminal <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- Admin Form -->
        <div id="adminForm" class="form-section">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="aEmail" placeholder="admin@sparkstechno.edu">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="aPass" placeholder="Admin Security Key">
            </div>
            <button class="btn-submit btn-admin" id="adminBtn" onclick="loginAdmin()">
                Authorize Access <i class="fa-solid fa-lock"></i>
            </button>
        </div>

        <div class="footer-badge">
            GEC BHOJPUR | <span>SPARKS TECHNO</span> | TECH FEST
        </div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgM4LrgOXnG8c7dDs6hgHbhJ7cSTo7dao",
            authDomain: "nexus-e-fd787.firebaseapp.com",
            databaseURL: "https://nexus-e-fd787-default-rtdb.firebaseio.com",
            projectId: "nexus-e-fd787",
            storageBucket: "nexus-e-fd787.firebasestorage.app",
            messagingSenderId: "850097280209",
            appId: "1:850097280209:web:eb708b0804d75486fae1f0",
            measurementId: "G-MVWZ3YFC3J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const MASTER_ADMIN_UID = "iLYylCZfyJPPN6h5Qmuof2xuKgu1";

        // Tab Switching
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
            
            if(tab === 'viewer') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('viewerForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('adminForm').classList.add('active');
            }
        };

        // Strict Authenticated Admin Login
        window.loginAdmin = async function() {
            const email = document.getElementById('aEmail').value.trim();
            const pass = document.getElementById('aPass').value.trim();
            const btn = document.getElementById('adminBtn');

            if(!email || !pass) {
                alert("Kripya Email aur Password enter karein!");
                return;
            }
            
            btn.innerHTML = "Verifying Credentials... <i class='fa-solid fa-spinner fa-spin'></i>";
            btn.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                if (user.uid === MASTER_ADMIN_UID) {
                    sessionStorage.setItem("nexusUserRole", "master_admin");
                } else {
                    sessionStorage.setItem("nexusUserRole", "co_admin");
                }

                sessionStorage.setItem("nexusAdminEmail", user.email);
                sessionStorage.setItem("nexusAdminUid", user.uid);

                window.location.href = "admin_dashboard.html";

            } catch(error) {
                alert("Access Denied: Sirf authorized Sparks Admins hi enter kar sakte hain!");
                btn.innerHTML = "Authorize Access <i class='fa-solid fa-lock'></i>";
                btn.disabled = false;
            }
        };

        // Viewer / User Access Handler
        window.loginViewer = function() {
            const name = document.getElementById('vName').value.trim();
            const role = document.getElementById('vRole').value;
            const id = document.getElementById('vId').value.trim();
            
            if(!name || !role || !id) {
                alert("Kripya saari details fill karein!");
                return;
            }
            
            sessionStorage.setItem("nexusViewerName", name);
            sessionStorage.setItem("nexusViewerRole", role);
            sessionStorage.setItem("nexusViewerId", id);
            
            window.location.href = "viewer_dashboard.html";
        };
    </script>
</body>
</html>
