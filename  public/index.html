<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus-E | Sparks Techno</title>
    
    <!-- Google Fonts: Outfit + Poster Fonts (Montserrat & Dancing Script) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #04070a;
            --emerald-glow: #00ff9d;
            --emerald-deep: #059669;
            --pink-neon: #ff2a85;
            --pink-accent: #f43f5e;
            --glass-surface: rgba(8, 15, 23, 0.78);
            --border-glow: rgba(0, 255, 157, 0.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: all 0.25s ease; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 255, 157, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 42, 133, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 0%, #062319 0%, var(--bg-dark) 75%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* High-tech Cyber Grid */
        .grid-bg {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: -1;
        }

        /* Glassmorphism Card with Dual Glow Border */
        .login-container {
            background: var(--glass-surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-top: 1px solid rgba(0, 255, 157, 0.5);
            border-right: 1px solid rgba(255, 42, 133, 0.35);
            border-radius: 24px;
            padding: 38px 34px;
            width: 100%;
            max-width: 460px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.65),
                0 0 35px rgba(0, 255, 157, 0.15),
                inset 0 0 25px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Top Ambient Glow Pill */
        .login-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--emerald-glow), var(--pink-neon), transparent);
            border-radius: 10px;
            filter: blur(1px);
        }

        /* ===== POSTER STYLE BRAND HEADER ===== */
        .poster-header {
            text-align: center;
            margin-bottom: 24px;
            user-select: none;
        }

        .brand-title-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Gradient Speed Bars */
        .speed-bar {
            display: inline-block;
            width: 28px;
            height: 9px;
            border-top: 3px solid var(--emerald-glow);
            border-bottom: 3px solid var(--emerald-glow);
            border-radius: 2px;
            opacity: 0.95;
            box-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
        }

        .brand-logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            line-height: 1;
        }

        .nexus-bold {
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        /* Cyber Pink Accent for '-E' */
        .dash-e-italic {
            color: var(--pink-neon);
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            padding-left: 3px;
            text-shadow: 0 0 20px rgba(255, 42, 133, 0.8), 0 0 35px rgba(255, 42, 133, 0.4);
        }

        .by-sparks-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .script-by {
            font-family: 'Dancing Script', cursive;
            color: var(--emerald-glow);
            font-size: 1.45rem;
            font-weight: 700;
            transform: rotate(-4deg);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.4);
        }

        .sparks-techno {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 4px;
            color: #f1f5f9;
            text-transform: uppercase;
        }

        .script-tagline {
            font-family: 'Dancing Script', cursive;
            color: #e2e8f0;
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.6px;
            margin-top: 5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
        }

        /* ===== CONTROLS & FORMS ===== */
        .tab-box {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            margin-bottom: 22px;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: rgba(0, 255, 157, 0.15);
            color: var(--emerald-glow);
            border: 1px solid rgba(0, 255, 157, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.4);
        }

        .form-section { display: none; animation: fadeIn 0.3s ease; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { position: relative; margin-bottom: 18px; }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--emerald-glow);
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--emerald-glow);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.35);
            background: rgba(3, 10, 16, 0.7);
        }

        select option { background: #070d14; color: white; }

        /* Action Buttons */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Interactive User Button (Neon Green with Pink glow hover) */
        .btn-viewer {
            background: linear-gradient(135deg, #00ff9d 0%, #059669 100%);
            color: #022013;
            box-shadow: 0 4px 20px rgba(0, 255, 157, 0.35);
        }

        .btn-viewer:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 255, 157, 0.5), 0 0 15px rgba(255, 42, 133, 0.3);
            filter: brightness(1.06);
        }

        /* Admin Button (Sleek Dark Cyber Pink Outline) */
        .btn-admin {
            background: rgba(255, 42, 133, 0.08);
            border: 1px solid rgba(255, 42, 133, 0.45);
            color: #ffa5cb;
        }

        .btn-admin:hover {
            background: rgba(255, 42, 133, 0.18);
            box-shadow: 0 4px 18px rgba(255, 42, 133, 0.35);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .footer-badge {
            text-align: center;
            margin-top: 24px;
            font-size: 0.74rem;
            color: #94a3b8;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .footer-badge span { color: var(--emerald-glow); }

        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .brand-logo-text { font-size: 2.2rem; }
            .speed-bar { width: 20px; height: 8px; }
            .sparks-techno { font-size: 0.9rem; letter-spacing: 3px; }
            .script-tagline { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="login-container">
        <!-- Poster Style Header with Cyber Emerald + Pink Accent -->
        <div class="poster-header">
            <div class="brand-title-wrap">
                <span class="speed-bar"></span>
                <h1 class="brand-logo-text">
                    <span class="nexus-bold">NEXUS</span><span class="dash-e-italic">-E</span>
                </h1>
                <span class="speed-bar"></span>
            </div>

            <div class="by-sparks-line">
                <span class="script-by">by</span>
                <span class="sparks-techno">SPARKS TECHNO</span>
            </div>

            <div class="script-tagline">
                Next Generation Energy Optimization
            </div>
        </div>

        <!-- Portal Tabs -->
        <div class="tab-box">
            <div class="tab-btn active" onclick="switchTab('viewer')">
                <i class="fa-solid fa-users-viewfinder"></i> User Portal
            </div>
            <div class="tab-btn" onclick="switchTab('admin')">
                <i class="fa-solid fa-shield-halved"></i> Sparks Admin
            </div>
        </div>

        <!-- User / Guest Portal Form -->
        <div id="viewerForm" class="form-section active">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="vName" placeholder="Enter Full Name">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-id-badge"></i>
                <select id="vRole">
                    <option value="" disabled selected>Select Your Role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Faculty / Teacher</option>
                    <option value="judge">Guest / Tech Fest Judge</option>
                </select>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-hashtag"></i>
                <input type="text" id="vId" placeholder="ID / Roll Number">
            </div>
            <button class="btn-submit btn-viewer" id="viewerBtn" onclick="loginViewer()">
                Enter Interactive Terminal <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- Admin Form -->
        <div id="adminForm" class="form-section">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="aEmail" placeholder="admin@sparkstechno.edu">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="aPass" placeholder="Admin Security Key">
            </div>
            <button class="btn-submit btn-admin" id="adminBtn" onclick="loginAdmin()">
                Authorize Access <i class="fa-solid fa-lock"></i>
            </button>
        </div>

        <div class="footer-badge">
            GEC BHOJPUR | <span>SPARKS TECHNO</span> | TECH FEST
        </div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgM4LrgOXnG8c7dDs6hgHbhJ7cSTo7dao",
            authDomain: "nexus-e-fd787.firebaseapp.com",
            databaseURL: "https://nexus-e-fd787-default-rtdb.firebaseio.com",
            projectId: "nexus-e-fd787",
            storageBucket: "nexus-e-fd787.firebasestorage.app",
            messagingSenderId: "850097280209",
            appId: "1:850097280209:web:eb708b0804d75486fae1f0",
            measurementId: "G-MVWZ3YFC3J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const MASTER_ADMIN_UID = "iLYylCZfyJPPN6h5Qmuof2xuKgu1";

        // Tab Switching
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
            
            if(tab === 'viewer') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('viewerForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('adminForm').classList.add('active');
            }
        };

        // Strict Authenticated Admin Login
        window.loginAdmin = async function() {
            const email = document.getElementById('aEmail').value.trim();
            const pass = document.getElementById('aPass').value.trim();
            const btn = document.getElementById('adminBtn');

            if(!email || !pass) {
                alert("Kripya Email aur Password enter karein!");
                return;
            }
            
            btn.innerHTML = "Verifying Credentials... <i class='fa-solid fa-spinner fa-spin'></i>";
            btn.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                if (user.uid === MASTER_ADMIN_UID) {
                    sessionStorage.setItem("nexusUserRole", "master_admin");
                } else {
                    sessionStorage.setItem("nexusUserRole", "co_admin");
                }

                sessionStorage.setItem("nexusAdminEmail", user.email);
                sessionStorage.setItem("nexusAdminUid", user.uid);

                window.location.href = "admin_dashboard.html";

            } catch(error) {
                alert("Access Denied: Sirf authorized Sparks Admins hi enter kar sakte hain!");
                btn.innerHTML = "Authorize Access <i class='fa-solid fa-lock'></i>";
                btn.disabled = false;
            }
        };

        // Viewer / User Access Handler
        window.loginViewer = function() {
            const name = document.getElementById('vName').value.trim();
            const role = document.getElementById('vRole').value;
            const id = document.getElementById('vId').value.trim();
            
            if(!name || !role || !id) {
                alert("Kripya saari details fill karein!");
                return;
            }
            
            sessionStorage.setItem("nexusViewerName", name);
            sessionStorage.setItem("nexusViewerRole", role);
            sessionStorage.setItem("nexusViewerId", id);
            
            window.location.href = "viewer_dashboard.html";
        };
    </script>
</body>
</html>
