<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus-E | Smart Class System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 15px; border: 1px solid #38bdf8; text-align: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); width: 350px; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-viewer { background: #38bdf8; color: #0f172a; }
        .btn-viewer:hover { background: #0284c7; color: white; }
        .btn-admin { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
        .btn-admin:hover { background: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>NEXUS-E</h1>
        <p>IoT Based Smart Class System</p>

        <!-- Viewer Login Form -->
        <input type="text" id="name" placeholder="Enter Full Name">
        <select id="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>
        <input type="text" id="userid" placeholder="Enter User ID (e.g. roll number)">
        
        <button class="btn-viewer" onclick="alert('Proceeding to Viewer Dashboard...')">Join as Viewer</button>
        
        <div style="margin: 15px 0; border-bottom: 1px dashed #334155;"></div>

        <button class="btn-admin" onclick="alert('Opening Admin Login...')">Group 5 Admin Login</button>
    </div>

</body>
</html>
